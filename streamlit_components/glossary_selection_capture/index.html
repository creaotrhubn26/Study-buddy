<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://unpkg.com/streamlit-component-lib@2.0.0/dist/index.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, sans-serif;
      color: #111827;
    }
    .shell {
      border: 1px solid #dbe7f7;
      background: #f8fbff;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hint {
      font-size: 12px;
      color: #4b5563;
      flex: 1 1 260px;
    }
    .selection {
      font-size: 13px;
      color: #0f172a;
      background: white;
      border: 1px dashed #c7d2fe;
      border-radius: 8px;
      padding: 8px 10px;
      width: 100%;
      min-height: 20px;
      box-sizing: border-box;
    }
    .btn {
      border: none;
      background: #1d4ed8;
      color: white;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }
    .floating-menu {
      position: fixed;
      display: none;
      z-index: 100000;
      min-width: 260px;
      max-width: 360px;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.92), rgba(255,255,255,0.82)),
        linear-gradient(180deg, rgba(248,250,252,0.96), rgba(255,255,255,0.98));
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.24);
      padding: 8px;
      font-family: Arial, sans-serif;
      backdrop-filter: blur(16px);
      transform: translateY(10px) scale(0.98);
      opacity: 0;
      transition: opacity 150ms ease, transform 180ms ease;
      pointer-events: none;
    }
    .floating-menu.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .floating-menu-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 8px 12px;
    }
    .floating-menu-badge {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 100%);
      color: #1d4ed8;
      font-size: 14px;
      flex: 0 0 auto;
    }
    .floating-menu-title {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      letter-spacing: 0.08em;
    }
    .floating-menu-term {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.35;
      margin-top: 2px;
      word-break: break-word;
    }
    .floating-menu-actions {
      display: grid;
      gap: 5px;
      padding: 0 2px;
    }
    .floating-menu-button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      font-weight: 600;
      transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
    }
    .floating-menu-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.10);
    }
    .floating-menu-button:active {
      transform: translateY(0);
    }
    .floating-menu-button.primary {
      background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
      color: #1e3a8a;
    }
    .floating-menu-button.secondary {
      background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      color: #334155;
    }
    .floating-menu-button.accent {
      background: linear-gradient(180deg, #f0fdf4 0%, #dcfce7 100%);
      color: #166534;
    }
    .floating-menu-icon {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.65);
      font-size: 14px;
      flex: 0 0 auto;
    }
    .floating-menu-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .floating-menu-button-title {
      font-size: 13px;
      font-weight: 700;
    }
    .floating-menu-button-subtitle {
      font-size: 11px;
      line-height: 1.35;
      opacity: 0.82;
    }
    .floating-menu-helper {
      padding: 10px 12px 6px 12px;
      font-size: 11px;
      line-height: 1.45;
      color: #64748b;
    }
    .inline-action-bar {
      display: none;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #dbe7f7;
      border-radius: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }
    .inline-action-bar.visible {
      display: block;
      animation: fadeSlideIn 160ms ease;
    }
    .inline-action-meta {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .inline-action-selection {
      font-weight: 700;
      color: #0f172a;
      display: block;
      margin-top: 3px;
      word-break: break-word;
    }
    .inline-action-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    .inline-action-btn {
      border: none;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .inline-action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.10);
    }
    .inline-action-btn.primary {
      background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
      color: #1e3a8a;
    }
    .inline-action-btn.secondary {
      background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      color: #334155;
    }
    .inline-action-btn.accent {
      background: linear-gradient(180deg, #f0fdf4 0%, #dcfce7 100%);
      color: #166534;
    }
    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="row">
      <div class="hint">Highlight a word, sentence, or question in the lesson text. Quick actions let you save it, explain it, or turn it into an exam-style answer. The button below still works as a fallback.</div>
      <button id="captureBtn" class="btn" disabled>Add highlighted text</button>
      <button id="clearBtn" class="btn btn-secondary">Clear</button>
    </div>
    <div id="selectionText" class="selection">No text selected yet.</div>
    <div id="inlineActionBar" class="inline-action-bar">
      <div id="inlineActionMeta" class="inline-action-meta">
        Selected text:
        <span id="inlineActionSelection" class="inline-action-selection"></span>
      </div>
      <div id="inlineActionButtons" class="inline-action-buttons"></div>
    </div>
  </div>

  <script>
    const selectionTextEl = document.getElementById("selectionText");
    const captureBtn = document.getElementById("captureBtn");
    const clearBtn = document.getElementById("clearBtn");
    const inlineActionBarEl = document.getElementById("inlineActionBar");
    const inlineActionSelectionEl = document.getElementById("inlineActionSelection");
    const inlineActionButtonsEl = document.getElementById("inlineActionButtons");
    const MENU_ACTIONS = [
      { key: "lesson", label: "Add to this lesson", subtitle: "Keep it local to the current lesson", icon: "📘", tone: "primary" },
      { key: "course", label: "Add to this course", subtitle: "Reuse it across all lessons in this course", icon: "🧭", tone: "secondary" },
      { key: "global", label: "Add to global glossary", subtitle: "Make it available everywhere", icon: "🌍", tone: "secondary" },
      { key: "suggest", label: "Explain with AI", subtitle: "Draft a contextual explanation instantly", icon: "✨", tone: "accent" },
      { key: "answer", label: "Answer like exam", subtitle: "Turn it into a short exam-style response", icon: "📝", tone: "accent" }
    ];

    let currentSelection = "";
    let listenersBound = false;
    let actionMenuEl = null;
    let lastSelectionExpander = null;
    let lastCapturedSelection = "";
    let lastFocusedSelection = "";

    function ensureParentStyles() {
      try {
        const parentDoc = window.parent.document;
        if (parentDoc.getElementById("study-buddy-selection-menu-styles")) return;
        const styleEl = parentDoc.createElement("style");
        styleEl.id = "study-buddy-selection-menu-styles";
        styleEl.textContent = `
          .floating-menu {
            position: fixed;
            display: none;
            z-index: 100000;
            min-width: 260px;
            max-width: 360px;
            background:
              radial-gradient(circle at top left, rgba(255,255,255,0.92), rgba(255,255,255,0.82)),
              linear-gradient(180deg, rgba(248,250,252,0.96), rgba(255,255,255,0.98));
            border: 1px solid rgba(148, 163, 184, 0.24);
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.24);
            padding: 8px;
            font-family: Arial, sans-serif;
            backdrop-filter: blur(16px);
            transform: translateY(10px) scale(0.98);
            opacity: 0;
            transition: opacity 150ms ease, transform 180ms ease;
            pointer-events: none;
          }
          .floating-menu.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
          }
          .floating-menu-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px 8px 12px;
          }
          .floating-menu-badge {
            width: 28px;
            height: 28px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 100%);
            color: #1d4ed8;
            font-size: 14px;
            flex: 0 0 auto;
          }
          .floating-menu-title {
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            letter-spacing: 0.08em;
          }
          .floating-menu-term {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.35;
            margin-top: 2px;
            word-break: break-word;
          }
          .floating-menu-actions {
            display: grid;
            gap: 5px;
            padding: 0 2px;
          }
          .floating-menu-button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 11px 12px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            font-weight: 600;
            transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
          }
          .floating-menu-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.10);
          }
          .floating-menu-button:active {
            transform: translateY(0);
          }
          .floating-menu-button.primary {
            background: linear-gradient(180deg, #eff6ff 0%, #dbeafe 100%);
            color: #1e3a8a;
          }
          .floating-menu-button.secondary {
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
            color: #334155;
          }
          .floating-menu-button.accent {
            background: linear-gradient(180deg, #f0fdf4 0%, #dcfce7 100%);
            color: #166534;
          }
          .floating-menu-icon {
            width: 28px;
            height: 28px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.65);
            font-size: 14px;
            flex: 0 0 auto;
          }
          .floating-menu-copy {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
          }
          .floating-menu-button-title {
            font-size: 13px;
            font-weight: 700;
          }
          .floating-menu-button-subtitle {
            font-size: 11px;
            line-height: 1.35;
            opacity: 0.82;
          }
          .floating-menu-helper {
            padding: 10px 12px 6px 12px;
            font-size: 11px;
            line-height: 1.45;
            color: #64748b;
          }
        `;
        parentDoc.head.appendChild(styleEl);
      } catch (err) {
        // ignore
      }
    }

    function normalizeSelection(text) {
      return (text || "").replace(/\s+/g, " ").trim();
    }

    function toElement(node) {
      if (!node) return null;
      return node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
    }

    function getOutermostExpander(element) {
      try {
        let current = element;
        let lastExpander = null;
        while (current) {
          if (current.matches && current.matches('div[data-testid="stExpander"]')) {
            lastExpander = current;
          }
          current = current.parentElement;
        }
        return lastExpander;
      } catch (err) {
        return null;
      }
    }

    function getNearestAncestor(element, selector) {
      try {
        let current = element;
        while (current) {
          if (current.matches && current.matches(selector)) {
            return current;
          }
          current = current.parentElement;
        }
      } catch (err) {
        return null;
      }
      return null;
    }

    function getHostExpander() {
      try {
        return getOutermostExpander(window.frameElement) || null;
      } catch (err) {
        return null;
      }
    }

    function getSelectionOwnerElement() {
      try {
        const selection = window.parent.getSelection();
        if (!selection || selection.rangeCount === 0) return null;
        return toElement(selection.anchorNode) || toElement(selection.focusNode);
      } catch (err) {
        return null;
      }
    }

    function selectionBelongsToThisLesson(ownerElementOverride = null) {
      try {
        const ownerElement = ownerElementOverride || getSelectionOwnerElement();
        const hostExpander = getHostExpander();
        if (!ownerElement || !hostExpander) return false;
        if (ownerElement.closest('input, textarea, [contenteditable="true"]')) return false;
        const selectionExpander = getOutermostExpander(ownerElement);
        const belongs = Boolean(selectionExpander && selectionExpander === hostExpander);
        if (belongs) {
          lastSelectionExpander = selectionExpander;
        }
        return belongs;
      } catch (err) {
        return false;
      }
    }

    function getParentSelection() {
      try {
        return normalizeSelection(window.parent.getSelection().toString());
      } catch (err) {
        return "";
      }
    }

    function updateSelectionPreview() {
      const ownerElement = getSelectionOwnerElement();
      const freshSelection = selectionBelongsToThisLesson(ownerElement) ? getParentSelection() : "";
      if (freshSelection) {
        currentSelection = freshSelection;
        lastCapturedSelection = freshSelection;
        selectionTextEl.textContent = currentSelection;
        captureBtn.disabled = false;
      } else {
        currentSelection = "";
        if (lastCapturedSelection) {
          selectionTextEl.textContent = lastCapturedSelection;
          captureBtn.disabled = false;
        } else {
          selectionTextEl.textContent = "No text selected yet.";
          captureBtn.disabled = true;
        }
      }
      renderInlineActions();
    }

    function getEffectiveSelection() {
      return currentSelection || lastCapturedSelection || "";
    }

    function renderInlineActions() {
      const effectiveSelection = getEffectiveSelection();
      if (!effectiveSelection) {
        inlineActionBarEl.classList.remove("visible");
        inlineActionSelectionEl.textContent = "";
        lastFocusedSelection = "";
        return;
      }
      const label = effectiveSelection.length > 72 ? `${effectiveSelection.slice(0, 69)}...` : effectiveSelection;
      inlineActionSelectionEl.textContent = label;
      inlineActionBarEl.classList.add("visible");
      focusManagerForSelection(effectiveSelection);
    }

    function focusManagerForSelection(selectionText) {
      if (!selectionText || selectionText === lastFocusedSelection) return;
      lastFocusedSelection = selectionText;
      try {
        const frame = window.frameElement;
        const nearestExpander = getNearestAncestor(frame, 'div[data-testid="stExpander"]');
        const nearestDetails = getNearestAncestor(frame, 'details');
        if (nearestDetails && !nearestDetails.hasAttribute('open')) {
          nearestDetails.setAttribute('open', 'open');
        }
        if (nearestExpander) {
          const summary = nearestExpander.querySelector('summary');
          if (summary && summary.getAttribute('aria-expanded') === 'false') {
            summary.click();
          }
        }
        window.setTimeout(() => {
          frame.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
        }, 90);
      } catch (err) {
        // ignore and fall back to the normal panel flow
      }
    }

    function buildInlineActionButtons() {
      inlineActionButtonsEl.innerHTML = "";
      MENU_ACTIONS.forEach((action) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `inline-action-btn ${action.tone}`;
        button.textContent = `${action.icon} ${action.label}`;
        button.addEventListener("click", () => {
          emitSelection(action.key);
        });
        inlineActionButtonsEl.appendChild(button);
      });
    }

    function ensureActionMenu() {
      if (actionMenuEl) return actionMenuEl;
      try {
        const parentDoc = window.parent.document;
        ensureParentStyles();
        actionMenuEl = parentDoc.createElement("div");
        actionMenuEl.setAttribute("role", "menu");
        actionMenuEl.className = "floating-menu";

        const header = parentDoc.createElement("div");
        header.className = "floating-menu-header";
        const badge = parentDoc.createElement("div");
        badge.className = "floating-menu-badge";
        badge.textContent = "🧠";
        const headerCopy = parentDoc.createElement("div");
        const headerTitle = parentDoc.createElement("div");
        headerTitle.className = "floating-menu-title";
        headerTitle.textContent = "WORD BANK ACTIONS";
        const headerTerm = parentDoc.createElement("div");
        headerTerm.className = "floating-menu-term";
        headerCopy.appendChild(headerTitle);
        headerCopy.appendChild(headerTerm);
        header.appendChild(badge);
        header.appendChild(headerCopy);
        const actionList = parentDoc.createElement("div");
        actionList.className = "floating-menu-actions";

        MENU_ACTIONS.forEach((action) => {
          const actionBtn = parentDoc.createElement("button");
          actionBtn.type = "button";
          actionBtn.dataset.action = action.key;
          actionBtn.className = `floating-menu-button ${action.tone}`;
          actionBtn.addEventListener("click", () => {
            emitSelection(action.key);
          });
          const icon = parentDoc.createElement("span");
          icon.className = "floating-menu-icon";
          icon.textContent = action.icon;
          const copy = parentDoc.createElement("span");
          copy.className = "floating-menu-copy";
          const title = parentDoc.createElement("span");
          title.className = "floating-menu-button-title";
          const subtitle = parentDoc.createElement("span");
          subtitle.className = "floating-menu-button-subtitle";
          title.textContent = action.label;
          subtitle.textContent = action.subtitle;
          copy.appendChild(title);
          copy.appendChild(subtitle);
          actionBtn.appendChild(icon);
          actionBtn.appendChild(copy);
          actionList.appendChild(actionBtn);
        });

        const helper = parentDoc.createElement("div");
        helper.className = "floating-menu-helper";
        helper.textContent = "Choose where to save the selected text, or let the app draft a contextual explanation first.";

        actionMenuEl.appendChild(header);
        actionMenuEl.appendChild(actionList);
        actionMenuEl.appendChild(helper);
        actionMenuEl._actionList = actionList;
        actionMenuEl._headerTerm = headerTerm;
        parentDoc.body.appendChild(actionMenuEl);
      } catch (err) {
        actionMenuEl = null;
      }
      return actionMenuEl;
    }

    function emitSelection(action) {
      updateSelectionPreview();
      const effectiveSelection = getEffectiveSelection();
      if (effectiveSelection) {
        Streamlit.setComponentValue({
          term: effectiveSelection,
          action: action || "lesson",
          nonce: Date.now()
        });
      }
      hideActionMenu();
    }

    function hideActionMenu() {
      if (actionMenuEl) {
        actionMenuEl.classList.remove("visible");
        window.setTimeout(() => {
          if (actionMenuEl && !actionMenuEl.classList.contains("visible")) {
            actionMenuEl.style.display = "none";
          }
        }, 160);
      }
    }

    function getSelectionRect() {
      try {
        const selection = window.parent.getSelection();
        if (!selection || selection.rangeCount === 0) return null;
        const range = selection.getRangeAt(0);
        if (range.collapsed) return null;
        const rect = range.getBoundingClientRect();
        if (rect && (rect.width || rect.height)) return rect;
        const rects = range.getClientRects();
        return rects && rects.length ? rects[0] : null;
      } catch (err) {
        return null;
      }
    }

    function showActionMenuNearSelection() {
      const menu = ensureActionMenu();
      if (!menu || !currentSelection) return;
      const rect = getSelectionRect();
      if (!rect) {
        hideActionMenu();
        return;
      }
      const label = currentSelection.length > 48 ? `${currentSelection.slice(0, 45)}...` : currentSelection;
      if (menu._headerTerm) {
        menu._headerTerm.textContent = label;
      }
      Array.from(menu._actionList.children).forEach((button) => {
        const action = button.dataset.action;
        const titleEl = button.querySelector('.floating-menu-button-title');
        if (action === "lesson") {
          titleEl.textContent = `Add "${label}" to this lesson`;
        } else if (action === "course") {
          titleEl.textContent = `Add "${label}" to this course`;
        } else if (action === "global") {
          titleEl.textContent = `Add "${label}" globally`;
        } else if (action === "suggest") {
          titleEl.textContent = `Explain "${label}" with AI`;
        }
      });
      menu.style.display = "block";
      menu.style.visibility = "hidden";
      menu.style.left = "0px";
      menu.style.top = "0px";

      const parentWin = window.parent;
      const menuRect = menu.getBoundingClientRect();
      const preferredLeft = rect.left + (rect.width / 2) - (menuRect.width / 2);
      const preferredTop = rect.bottom + 10;
      const maxLeft = Math.max(12, parentWin.innerWidth - menuRect.width - 12);
      const maxTop = Math.max(12, parentWin.innerHeight - menuRect.height - 12);
      let left = Math.min(Math.max(12, preferredLeft), maxLeft);
      let top = Math.min(preferredTop, maxTop);
      if (preferredTop > maxTop && rect.top - menuRect.height - 10 > 12) {
        top = rect.top - menuRect.height - 10;
      }

      menu.style.left = `${left}px`;
      menu.style.top = `${top}px`;
      menu.style.visibility = "visible";
      window.requestAnimationFrame(() => {
        menu.classList.add("visible");
      });
    }

    function syncActionMenu() {
      if (currentSelection && lastSelectionExpander && getHostExpander() === lastSelectionExpander) {
        showActionMenuNearSelection();
      } else {
        hideActionMenu();
      }
    }

    function bindParentListeners() {
      if (listenersBound) return;
      listenersBound = true;
      try {
        const parentDoc = window.parent.document;
        parentDoc.addEventListener("selectionchange", () => {
          updateSelectionPreview();
          if (!currentSelection) {
            hideActionMenu();
          }
        }, true);
        ["mouseup", "keyup"].forEach((eventName) => {
          parentDoc.addEventListener(eventName, () => {
            updateSelectionPreview();
            syncActionMenu();
          }, true);
        });
        parentDoc.addEventListener("click", (event) => {
          if (actionMenuEl && actionMenuEl.contains(event.target)) return;
          hideActionMenu();
        }, true);
        parentDoc.addEventListener("scroll", hideActionMenu, true);
        parentDoc.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            hideActionMenu();
          }
        }, true);
      } catch (err) {
        selectionTextEl.textContent = "Selection capture is not available in this browser session.";
      }
    }

    captureBtn.addEventListener("click", () => {
      emitSelection("lesson");
    });

    clearBtn.addEventListener("click", () => {
      currentSelection = "";
      lastCapturedSelection = "";
      selectionTextEl.textContent = "No text selected yet.";
      captureBtn.disabled = true;
      hideActionMenu();
      renderInlineActions();
      Streamlit.setComponentValue("");
    });

    function onRender(event) {
      buildInlineActionButtons();
      bindParentListeners();
      updateSelectionPreview();
      Streamlit.setFrameHeight(92);
    }

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(92);
  </script>
</body>
</html>
